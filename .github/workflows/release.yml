name: Release

# Push a tag like v0.2.0 (or run this workflow by hand with a version) to build
# Blippy and publish it as a GitHub release with a ready-to-run zip.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0 (tags the current commit v0.2.0)
        required: true
  # Every pull request gets a dry run of everything but the publish step, so a
  # change that would break packaging shows up before a release is cut.
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $raw = switch ($env:GITHUB_EVENT_NAME) {
            'workflow_dispatch' { $env:INPUT_VERSION }
            'pull_request' { '0.0.0-dryrun' }
            default { $env:GITHUB_REF_NAME }
          }
          $version = $raw.Trim() -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$raw' is not a version like 0.2.0 or 0.2.0-beta.1" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/Blippy.Core.Tests --configuration Release

      - name: Publish
        run: >
          dotnet publish src/Blippy/Blippy.csproj --configuration Release --runtime win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/Blippy

      - name: Make sure the build starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath artifacts/Blippy/Blippy.exe -ArgumentList '--preview', 'artifacts/preview' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Preview failed with exit code $($p.ExitCode)" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "Blippy-${{ steps.version.outputs.version }}-win-x64"
          $stage = "artifacts/$name"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item artifacts/Blippy/Blippy.exe, artifacts/Blippy/Assets/Icons/LICENSE-tabler-icons.txt, THIRD_PARTY_NOTICES.md, README.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/$name.zip"
          $hash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "artifacts/$name.zip.sha256"
          Copy-Item artifacts/preview/flyout-light.png artifacts/screenshot-light.png
          Copy-Item artifacts/preview/flyout-dark.png artifacts/screenshot-dark.png
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Publish the GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $name = '${{ steps.package.outputs.name }}'
          $notes = @"
          Download **$name.zip**, unzip it anywhere and run ``Blippy.exe``. Nothing to install; Windows 10 (2004) or newer.

          New tray icons start under the **^** arrow. Drag them onto the taskbar to always see them.
          "@
          $flags = @('--title', "Blippy ${{ steps.version.outputs.version }}", '--notes', $notes, '--generate-notes', '--target', $env:GITHUB_SHA)
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $tag "artifacts/$name.zip" "artifacts/$name.zip.sha256" artifacts/screenshot-light.png artifacts/screenshot-dark.png @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
